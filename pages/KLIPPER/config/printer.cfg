[mcu]
serial: /dev/serial/by-id/...     				# Insert your MCU ID

[mcu RPi]
serial: /tmp/klipper_host_mcu

# Velocity and accel values here are set for safe, comfortable and quieter non-print motion and are adjusted by macros during print etc.
[printer]
kinematics: [[KINEMATICS]]
max_velocity: [[MAX_VELOCITY]]
max_accel: [[MAX_ACCEL]]
square_corner_velocity: [[SQUARE_CORNER_VELOCITY]]
max_z_velocity: [[MAX_Z_VELOCITY]]
max_z_accel: [[MAX_Z_ACCEL]]

# IF BED_PROBE_IS_CARTO
[mcu cartographer]
serial: /dev/serial/by-id/...					# Insert your Carto MCU ID
restart_method: command 						# Not needed for probes using CAN. 

[cartographer]
mcu: cartographer            
x_offset: [[CARTO_X_OFF]]
y_offset: [[CARTO_Y_OFF]]
verbose: no										# For extra output

[bed_mesh]
zero_reference_position: [[CENTER_X]], [[CENTER_Y]]				# Center of the bed
speed: [[CARTO_MESH_SPEED]]										# XY movement speed during bed mesh
horizontal_move_z: [[CARTO_MESH_Z_HOP]]							# Z height during bed mesh scan
mesh_min: [[CARTO_MESH_START]]								# [X, Y] bed mesh starting point
mesh_max: [[CARTO_MESH_END]]								# [X, Y] bed mesh end point
probe_count: [[CARTO_MESH_COUNT]]
#algorithm: bicubic
adaptive_margin: 10
mesh_pps: 0,0 									# Interpolation - disabled - mesh should be dense enough
# ENDIF

# IF HAS_Z_TILT
[z_tilt]
z_positions:
   [[TILT_POS1]]											# Left kinematic mount
   [[TILT_POS2]]										# Rear kinematic mount
   [[TILT_POS3]]										# Right kinematic mount
points:
   [[TILT_POINT1]]										# Left measurement position
   [[TILT_POINT2]]										# Rear measurement position
   [[TILT_POINT3]]										# Right measurement position
speed: 300										# Travel speed
horizontal_move_z: 20							# Z position between measurements
retries: 5
retry_tolerance: 0.01
# ENDIF

[safe_z_home]
home_xy_position: [[CENTER_X]], [[CENTER_Y]]						# Center of the bed
z_hop: 10
z_hop_speed: 100.0


