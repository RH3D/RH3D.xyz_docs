# IF PART_COOLING_IS_CPAP
# [[FAN: part_cooling]]
#--------------------    [[2W_FAN_NAME]]    --------------------
[fan] #CPAP
pin: ![[2W_FAN]]
cycle_time: 0.0005
kick_start_time: 0.3
off_below: 0.25
enable_pin: [[E3_HEATER]]
shutdown_speed: 0

# ENDIF
# IF !PART_COOLING_IS_CPAP
# [[FAN: part_cooling]]
#--------------------    [[2W_FAN_NAME]]    --------------------
[fan]
pin: [[2W_FAN]]
cycle_time: 0.01
kick_start_time: 0.3

# ENDIF
# [[FAN: hotend_cooling]]
#--------------------    [[2W_FAN_NAME]]    --------------------
[heater_fan heatbreak_cooling_fan]
pin: [[2W_FAN]]
heater: extruder
heater_temp: 50.0
fan_speed: 0.8

# [[FAN: controller_fan]]
#--------------------    [[2W_FAN_NAME]]    --------------------
[controller_fan electronics_fan]
pin: [[2W_FAN]]
hardware_pwm: False
cycle_time: 0.01
fan_speed: 0.4
idle_timeout: 3600
idle_speed: 0.25

# [[FAN: driver_fan]]
#--------------------    [[2W_FAN_NAME]]    --------------------
[controller_fan driver_fan]
pin: [[2W_FAN]]
stepper: stepper_x, stepper_y
hardware_pwm: False
fan_speed: 0.6
idle_timeout: 3600
idle_speed: 0.2

# IF HAS_MOTOR_COOLING && !HAS_MOTOR_THERMISTORS
# [[FAN: stepper_fan]]
# #--------------------    [[2W_FAN_NAME]]    --------------------
# [fan_generic motor_fan]
# pin: [[2W_FAN]]
# #stepper: stepper_x, stepper_y
# hardware_pwm: False
# #fan_speed: 0.75
# #idle_timeout: 3600
# #idle_speed: 0.2

# ENDIF
# IF HAS_MOTOR_COOLING && HAS_MOTOR_THERMISTORS
# [[FAN: stepper_fan]]
#--------------------    [[2W_FAN_NAME]]    --------------------
[temperature_fan motor_fan]
pin: [[2W_FAN]]
hardware_pwm: False
sensor_type: temperature_combined
sensor_list: temperature_sensor motor_right, temperature_sensor motor_left
combination_method: max
maximum_deviation: 20
control: pid
# --- Linear Fan Curve Configuration ---
control: pid
target_temp: 80.0      # The temperature where the fan reaches 100% speed
pid_Kp: 5.7375         # Scales the speed linearly between 40°C and 80°C
pid_Ki: 0.0            # Disabled for pure linear scaling
pid_Kd: 0.0            # Disabled for pure linear scaling
min_speed: 0.0         # CRITICAL: Allows the fan to turn completely off below 40°C
max_speed: 1.0         # Allows the fan to reach full power at 80°C
off_below: 0.1         # Cuts the power completely if the math drops below 10% (under 40°C)
kick_start_time: 0.5   # Gives a 0.5-second full power burst to help the fan start spinning
min_temp: 0
max_temp: 100

# ENDIF


