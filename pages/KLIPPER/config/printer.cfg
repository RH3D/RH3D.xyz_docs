shaper_type_x: [[IS_2WD_TYPE_X]]
damping_ratio_x: [[IS_2WD_DAMP_X]]
#--------------------    Y AXIS    --------------------
shaper_freq_y: [[IS_2WD_FREQ_Y]]
shaper_type_y: [[IS_2WD_TYPE_Y]]
damping_ratio_y: [[IS_2WD_DAMP_Y]]

# ENDIF
# IF HAS_4WD
[input_shaper]
#--------------------    X AXIS    --------------------
shaper_freq_x: [[IS_4WD_FREQ_X]]
shaper_type_x: [[IS_4WD_TYPE_X]]
damping_ratio_x: [[IS_4WD_DAMP_X]]
#--------------------    Y AXIS    --------------------
shaper_freq_y: [[IS_4WD_FREQ_Y]]
shaper_type_y: [[IS_4WD_TYPE_Y]]
damping_ratio_y: [[IS_4WD_DAMP_Y]]

# ENDIF
[gcode_arcs]
resolution: 0.1

[firmware_retraction]
retract_length: 0.6
retract_speed: 40
unretract_extra_length: 0
unretract_speed: 60


