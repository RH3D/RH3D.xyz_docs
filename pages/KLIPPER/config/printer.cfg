min_temp: 5
max_temp: 100

# [[TH: motor_left]]
[temperature_sensor motor_left]
sensor_pin:  [[TH_TEMP]]
sensor_type: EPCOS 100K B57560G104F
min_temp: 5
max_temp: 100

# ENDIF
# IF HAS_CHAMBER_THERMISTOR
# [[TH: chamber_thermistor]]
[temperature_sensor chamber]
