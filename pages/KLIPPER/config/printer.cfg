nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: [[E0_HEATER]]
sensor_pin:  [[TH0_TEMP]]
sensor_type: PT1000
pullup_resistor: 2200
#control: pid
#pid_Kp: 22.2
#pid_Ki: 1.08
#pid_Kd: 114
min_temp: 0
max_temp: 320
min_extrude_temp: 170
pressure_advance: [[PA]]
pressure_advance_smooth_time: [[PA_TIME]]
max_extrude_only_distance: 150.0
max_extrude_cross_section: 1


