[gcode_macro PRINT_START]
gcode:
# This part fetches data from your slicer. Such as bed, extruder, and chamber temps and print profile speed info.
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_chamber = params.CHAMBER|default("30")|int %}
  {% set profile = params.PROFILE|default("normal")|string|lower %}
  {% set vars = printer["gcode_macro _USER_VARIABLES"] %}
  {% set current_bed = printer.heater_bed.temperature %}
  SET_GCODE_VARIABLE MACRO=_USER_VARIABLES VARIABLE=print_profile VALUE='"{profile}"'
    M140 S{target_bed}                        # Bed heating start
  {% if vars.xy_skewed %}                     # If user created skew profile, load it (default name = "skew_profile")
    SKEW_PROFILE LOAD=skew_profile
  {% endif %}
# IF PRINTER_IS_VIRTU_E3
  SAFE_TILT_HOME PRINTING=1                   # Safe homing and tilt alignment
# ENDIF
# IF BED_PROBE_IS_BDSENSOR
  BDSENSOR_SET COLLISION_HOMING=0                     # Disable nozzle touch
# ENDIF
# IF PRINTER_IS_E3NG
    G28
    G1 Z30                                    # move further for preheating
# ENDIF
	RESPOND MSG="WAITING FOR THE BED AND HOTEND TO REACH THE TEMPERATURE."
    M104 S90                                  # Extruder preheating to 150
    #M104 S150                                 # Extruder preheating to 150
    M190 S{target_bed}                        # Wait for bed temperature
    M109 S150                                 # Wait for extruder at 150
	{% if vars.heatsoak_time > 0 %}
		{% if current_bed < (target_bed * 0.9) %}
    		RESPOND MSG="WAITING FOR THE BED TO HEATSOAK AND STABILIZE ({vars.heatsoak_time} MIN)."
    		G4 P{vars.heatsoak_time * 60000}  # Wait {vars.heatsoak_time} min for the bedtemp to stabilize
		{% else %}
    		RESPOND MSG="BED ALREADY HOT: SKIPPING BED HEATSOAK."
		{% endif %}
	{% else %}
      RESPOND MSG="HEATSOAK DISABLED BY USER."
	{% endif %}
	G1 Z10                                    # Move closer for nozzle touch
# IF BED_PROBE_IS_CARTO
  CARTOGRAPHER_TOUCH_HOME                     # Nozzle touch
# ENDIF
# IF BED_PROBE_IS_BDSENSOR
  BDSENSOR_SET COLLISION_HOMING=1                     # Enable nozzle touch
    G28 Z                                     # Home Z with bed tilt adjusted
# ENDIF
  BED_MESH_CALIBRATE                          # Start the bed mesh (add ADAPTIVE=1 for adaptive bed mesh)
    M104 S{target_extruder}                   # Extruder heating start
    G1 X20 Y2 Z20 F3000                       # Heating position
    M109 S{target_extruder}                   # Extruder heatup wait 
	SET_XY_CURRENT LEVEL={profile}            # Set XY motor currents based on the speed profile
  # PRIMELINE
    G0 X2 Y2 F10000                           # Go to starting point
    G0 Z0.4                                   # Raise Z to 0.4
    G91                                       # Incremental positioning 
    G1 F1800 E4                               # Fill the nozzle
    G1 X50 E20 F1000                          # Primeline
    G90                                       # Absolute position

[gcode_macro PRINT_END]
gcode:
  {% set vars = printer["gcode_macro _USER_VARIABLES"] %}
    G4                                        # Wait to finish commands
    M221 S100                                 # Flow to 100%
    M106 S0                                   # OFF - cooling fan
    M104 S0                                   # OFF - hotend heater
    M140 S0                                   # OFF - bed heater
    G91                                       # Relative positioning
    G1 Z1
    G1 F1800 E-3                              # Retract 3 mm to reduce oozing
    G90                                       # Absolute positioning
    G1 X10 Y210 F30000                        # Move toolhead back
  {% if vars.z_park_end %}
	G1 Z{printer.toolhead.axis_maximum.z|float - 10} F24000                        # Move bed down
  {% endif %}
  SET_Z_CURRENT LEVEL=idle                    # Set Z motors current to idle
  SET_XY_CURRENT LEVEL=quiet                  # Set XY motors current to quiet
  SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0 # Disable extruder stepper motor
  SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0 # Disable XY stepper motors (rear)
  SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0
  {% if vars.is_awd %}
    SET_STEPPER_ENABLE STEPPER=stepper_x1 ENABLE=0 # Disable XY stepper motors (front, if AWD)
	SET_STEPPER_ENABLE STEPPER=stepper_y1 ENABLE=0
  {% endif %}
  SET_KINEMATIC_POSITION CLEAR_HOMED=XY       # Clear XY axis homing status
  {% if not vars.z_hold %}
    SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=0
# IF HAS_Z_TILT
	SET_STEPPER_ENABLE STEPPER=stepper_z1 ENABLE=0
	SET_STEPPER_ENABLE STEPPER=stepper_z2 ENABLE=0
# ENDIF
  	SET_KINEMATIC_POSITION CLEAR_HOMED=Z      # Clear Z axis homing status
  {% endif %}


