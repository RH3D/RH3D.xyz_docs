[gcode_macro SET_Z_CURRENT]
description: Set current level - low / idle / normal
gcode:
    {% set level = params.LEVEL|default("normal")|string %}
    {% set vars = printer["gcode_macro _USER_VARIABLES"] %}
    {% set val = vars.z_normal %}
    {% if level == "idle" %} {% set val = vars.z_idle %}
    {% elif level == "low" %} {% set val = vars.z_low %}
    {% endif %}
    SET_TMC_CURRENT STEPPER=stepper_z CURRENT={val} HOLDCURRENT={val}
# IF HAS_Z_TILT
    SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT={val} HOLDCURRENT={val}
    SET_TMC_CURRENT STEPPER=stepper_z2 CURRENT={val} HOLDCURRENT={val}
# ENDIF

[gcode_macro SET_XY_CURRENT]
description: Set current level - idle / quiet / normal / fast
gcode:
    {% set level = params.LEVEL|default("normal")|string %}
    {% set vars = printer["gcode_macro _USER_VARIABLES"] %}
    {% set val = vars.xy_normal %}
    {% if level == "quiet" %} {% set val = vars.xy_quiet %}
    {% elif level == "fast" %} {% set val = vars.xy_fast %}
    {% elif level == "idle" %} {% set val = vars.xy_idle %}
    {% endif %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={val} HOLDCURRENT={val}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={val} HOLDCURRENT={val}
    {% if vars.is_awd %}
        SET_TMC_CURRENT STEPPER=stepper_x1 CURRENT={val} HOLDCURRENT={val}
        SET_TMC_CURRENT STEPPER=stepper_y1 CURRENT={val} HOLDCURRENT={val}
    {% endif %}

[gcode_macro _ECHO_USER_VARIABLES]
gcode:
    {% set vars = printer["gcode_macro _USER_VARIABLES"] %}
    { action_respond_info("Current Settings:
                          Z Idle: %s
                          XY Idle: %s
                          AWD Mode: %s" % (vars.z_idle, vars.xy_idle, vars.is_awd)) }

# IF PRINTER_IS_VIRTU_E3
[gcode_macro SAFE_TILT_HOME]
gcode:
  {% set vars = printer["gcode_macro _USER_VARIABLES"] %}
  {% set z_max = printer.toolhead.axis_maximum.z|float %}
  {% set printing = params.PRINTING|default(0)|int %}
    G90                                       # use absolute coordinates
    M83                                       # extruder relative mode
    G21                                       # metric values
    SET_GCODE_OFFSET Z=0                      # Reset Z offset
  SET_Z_CURRENT LEVEL=normal				  # Set Z motor current (normal)
  SET_XY_CURRENT LEVEL=quiet				  # Set Z motor current (quiet)
    G28
    G1 Z{printer.toolhead.axis_maximum.z|float - 17} F24000                            # PRE-Z_TILT 1. go to bottom position
  SET_Z_CURRENT LEVEL=low				  	  # Set Z motor current to low for the least motor resistance
    G1 Z{printer.toolhead.axis_maximum.z|float - 2} F150                              # PRE-Z_TILT 2. roughly align motors if misaligned too much (to avoid damaging bed while TILT)
  SET_Z_CURRENT LEVEL=normal				  # Set Z motor current (normal)
    G1 Z30 F24000                             # PRE-Z_TILT 3. move bed up again
    G28 Z                                     # Home Z after PRE-Z_TILT sequence
  Z_TILT_ADJUST                               # Normal and safe bed tilt adjustment
    G1 X110 Y110 Z50 F24000
  {% if printing == 0 %}					  # If we are NOT in the PRINT_START macro, set Z to "idle" and disable X, Y, E motors, otherwise keep them on
    SET_Z_CURRENT LEVEL=idle
	SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0
    {% if vars.is_awd %}
      SET_STEPPER_ENABLE STEPPER=stepper_x1 ENABLE=0
	  SET_STEPPER_ENABLE STEPPER=stepper_y1 ENABLE=0
    {% endif %}
    SET_KINEMATIC_POSITION CLEAR_HOMED=XY
  	{% if not vars.z_hold %}
      SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=0
# IF HAS_Z_TILT
	  SET_STEPPER_ENABLE STEPPER=stepper_z1 ENABLE=0
	  SET_STEPPER_ENABLE STEPPER=stepper_z2 ENABLE=0
# ENDIF
  	  SET_KINEMATIC_POSITION CLEAR_HOMED=Z      # Clear Z axis homing status
  	{% endif %}
  {% endif %}
# ENDIF

[idle_timeout]
timeout: 7200
gcode:
  {% if printer.pause_resume.is_paused %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=True
    {action_respond_info("Idle Timeout: Extruder powered down")}
    M104 S0                                    # OFF - hotend heater
  {% else %}
    {action_respond_info("Idle Timeout: Stepper and Heater powered down")}
    TURN_OFF_HEATERS                           # OFF - all heaters
    M84                                        # Motors OFF
  {% endif %}

[delayed_gcode _USER_PAUSE]
gcode:
  SET_XY_CURRENT LEVEL=idle
  SET_Z_CURRENT LEVEL=idle

[gcode_macro _USER_RESUME]
gcode:
  {% set vars = printer["gcode_macro _USER_VARIABLES"] %}
  SET_XY_CURRENT LEVEL={vars.print_profile}
  SET_Z_CURRENT LEVEL=normal

[gcode_macro _USER_CANCEL]
gcode:
  {% set vars = printer["gcode_macro _USER_VARIABLES"] %}
  {% if printer.pause_resume.is_paused %}
  	SET_Z_CURRENT LEVEL=normal                  # Set Z motors current to normal
  	SET_XY_CURRENT LEVEL=quiet                  # Set XY motors current to quiet
  {% endif %}
  {% if vars.z_park_end %}
	G1 Z{printer.toolhead.axis_maximum.z|float - 10} F12000                        # Move bed down
  {% endif %}
  SET_Z_CURRENT LEVEL=idle                    # Set Z motors current to idle
  SET_XY_CURRENT LEVEL=quiet                  # Set XY motors current to quiet
  SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0 # Disable extruder stepper motor
  SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0 # Disable XY stepper motors (rear)
  SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0
  {% if vars.is_awd %}
    SET_STEPPER_ENABLE STEPPER=stepper_x1 ENABLE=0 # Disable XY stepper motors (front, if AWD)
	SET_STEPPER_ENABLE STEPPER=stepper_y1 ENABLE=0
  {% endif %}
  SET_KINEMATIC_POSITION CLEAR_HOMED=XY       # Clear XY axis homing status
  {% if not vars.z_hold %}
    SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=0
# IF HAS_Z_TILT
	SET_STEPPER_ENABLE STEPPER=stepper_z1 ENABLE=0
	SET_STEPPER_ENABLE STEPPER=stepper_z2 ENABLE=0
# ENDIF
  	SET_KINEMATIC_POSITION CLEAR_HOMED=Z      # Clear Z axis homing status
  {% endif %}
  
