# --- AUTO-APPLY AT BOOT ---
[delayed_gcode _INIT_USER_SETTINGS]
initial_duration: 2
gcode:
    # The startup macro, runs once on boot, sets motor currents to idle and enables Z stepper motors
	{% set vars = printer["gcode_macro _USER_VARIABLES"] %}
    SET_Z_CURRENT LEVEL="idle"
    SET_XY_CURRENT LEVEL="idle"
    SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=1
# IF PRINTER_IS_VIRTU_E3
	SET_STEPPER_ENABLE STEPPER=stepper_z1 ENABLE=1
	SET_STEPPER_ENABLE STEPPER=stepper_z2 ENABLE=1
# ENDIF
    {% if not vars.z_boot %}
    SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=0
# IF PRINTER_IS_VIRTU_E3
	SET_STEPPER_ENABLE STEPPER=stepper_z1 ENABLE=0
	SET_STEPPER_ENABLE STEPPER=stepper_z2 ENABLE=0
# ENDIF
    {% endif %}
    RESPOND MSG="Manual Config Loaded: Z={vars.z_idle}A, XY={vars.xy_idle}A, AWD={vars.is_awd}"


