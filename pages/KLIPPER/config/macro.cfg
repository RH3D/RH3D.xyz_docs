# --- AUTO-APPLY AT BOOT ---
[delayed_gcode _INIT_USER_SETTINGS]
initial_duration: 2
gcode:
    # This runs once on startup and pulls values directly from the variables above
    SET_Z_CURRENT LEVEL="idle"
    SET_XY_CURRENT LEVEL="idle"
    SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=1
	SET_STEPPER_ENABLE STEPPER=stepper_z1 ENABLE=1
	SET_STEPPER_ENABLE STEPPER=stepper_z2 ENABLE=1
#    G4 P2000
#    M84
    {% set vars = printer["gcode_macro _USER_VARIABLES"] %}
    RESPOND MSG="Manual Config Loaded: Z={vars.z_idle}A, XY={vars.xy_idle}A, AWD={vars.is_awd}"


#    █▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀█
#    █  ▄▀▀▄ ▀▀█▀▀ █  █  █▀▀▀ █▀▀▄  █
#    █  █  █   █   █▄▄█  █▄▄  █▄▄▀  █
#    █  █  █   █   █  █  █    █  █  █
#    █  ▀▄▄▀   █   █  █  █▄▄▄ █  █  █
#    █▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄█


# --- CURRENT CONTROL MACROS ---
[gcode_macro SET_Z_CURRENT]
description: Set current level - low / idle / normal
gcode:
    {% set level = params.LEVEL|default("normal")|string %}
    {% set vars = printer["gcode_macro _USER_VARIABLES"] %}
    {% set val = vars.z_normal %}
    {% if level == "idle" %} {% set val = vars.z_idle %}
    {% elif level == "low" %} {% set val = vars.z_low %}
    {% endif %}
    SET_TMC_CURRENT STEPPER=stepper_z CURRENT={val}
    # If you have stepper_z1, z2, etc., add them here:
    SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT={val}
    SET_TMC_CURRENT STEPPER=stepper_z2 CURRENT={val}

[gcode_macro SET_XY_CURRENT]
description: Set current level - idle / quiet / normal / fast
gcode:
    {% set level = params.LEVEL|default("normal")|string %}
    {% set vars = printer["gcode_macro _USER_VARIABLES"] %}
    {% set val = vars.xy_normal %}
    {% if level == "quiet" %} {% set val = vars.xy_quiet %}
    {% elif level == "fast" %} {% set val = vars.xy_fast %}
    {% elif level == "idle" %} {% set val = vars.xy_idle %}
    {% endif %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={val}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={val}
    {% if vars.is_awd %}
        SET_TMC_CURRENT STEPPER=stepper_x1 CURRENT={val}
        SET_TMC_CURRENT STEPPER=stepper_y1 CURRENT={val}
    {% endif %}

[gcode_macro ECHO_USER_VARIABLES]
gcode:
    {% set vars = printer["gcode_macro _USER_VARIABLES"] %}
    { action_respond_info("Current Settings:
                          Z Idle: %s
                          XY Idle: %s
                          AWD Mode: %s" % (vars.z_idle, vars.xy_idle, vars.is_awd)) }

# IF PRINTER_IS_VIRTU_E3
[gcode_macro SAFE_TILT_HOME]
gcode:
  {% set vars = printer["gcode_macro _USER_VARIABLES"] %}
    G90                                       # use absolute coordinates
    M83                                       # extruder relative mode
    G21                                       # metric values
    SET_GCODE_OFFSET Z=0                      # Reset Z offset
  SET_TMC_CURRENT STEPPER=stepper_x CURRENT={ vars.xy_quiet }
  SET_TMC_CURRENT STEPPER=stepper_y CURRENT={ vars.xy_quiet }
  {% if vars.is_awd %}
	SET_TMC_CURRENT STEPPER=stepper_x1 CURRENT={ vars.xy_quiet }
	SET_TMC_CURRENT STEPPER=stepper_y1 CURRENT={ vars.xy_quiet }
  {% endif %}
  SET_TMC_CURRENT STEPPER=stepper_z CURRENT={ vars.z_normal }
  SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT={ vars.z_normal }
  SET_TMC_CURRENT STEPPER=stepper_z2 CURRENT={ vars.z_normal }
    G28
    G1 Z215 F24000                            # pre-Z-tilt sequence - go to position
  SET_TMC_CURRENT STEPPER=stepper_z CURRENT={ vars.z_low }
  SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT={ vars.z_low }
  SET_TMC_CURRENT STEPPER=stepper_z2 CURRENT={ vars.z_low }
    G1 Z230 F150                              # pre-Z-tilt sequence - roughly align motors if misaligned too much to avoid hitting bed while TILT
  SET_TMC_CURRENT STEPPER=stepper_z CURRENT={ vars.z_normal }
  SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT={ vars.z_normal }
  SET_TMC_CURRENT STEPPER=stepper_z2 CURRENT={ vars.z_normal }
    G1 Z30 F24000                             # pre-Z-tilt sequence - roughly align motors if misaligned too much
    G28 Z                                     # home Z after ...
  Z_TILT_ADJUST                               # adjust bed tilt
    G28 Z                                     # home Z with bed tilt adjusted
    G1 X110 Y110 Z50 F24000
  SET_TMC_CURRENT STEPPER=stepper_z CURRENT={ vars.z_idle }
  SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT={ vars.z_idle }
  SET_TMC_CURRENT STEPPER=stepper_z2 CURRENT={ vars.z_idle }
  SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
  SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0
  SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
  {% if vars.is_awd %}
    SET_STEPPER_ENABLE STEPPER=stepper_x1 ENABLE=0
	SET_STEPPER_ENABLE STEPPER=stepper_y1 ENABLE=0
  {% endif %}
  SET_KINEMATIC_POSITION CLEAR_HOMED=XY
# ENDIF

[gcode_macro SET_XY_CUST_CURRENT]
description: Set current [A]
gcode:
    # Current
    {% set current  = params.CURRENT|default(2.0)|float %}
    
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={current}
        SET_TMC_CURRENT STEPPER=stepper_x1 CURRENT={current}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={current}
        SET_TMC_CURRENT STEPPER=stepper_y1 CURRENT={current}

[gcode_macro SET_Z_CUST_CURRENT]
description: Set current [A]
gcode:
    # Current
    {% set current  = params.CURRENT|default(0.8)|float %}
    
        SET_TMC_CURRENT STEPPER=stepper_z CURRENT={current}
        SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT={current}
        SET_TMC_CURRENT STEPPER=stepper_z2 CURRENT={current}

[gcode_macro TEST_SPEED]
# Home, get position, throw around toolhead, home again.
# If MCU stepper positions (first line in GET_POSITION) are greater than a full step different (your number of microsteps), then skipping occured.
# We only measure to a full step to accomodate for endstop variance.
# Example: TEST_SPEED SPEED=300 ACCEL=5000 ITERATIONS=10

description: Test for max speed and acceleration parameters for the printer. Procedure: Home -> ReadPositionFromMCU -> MovesToolhead@Vel&Accel -> Home -> ReadPositionfromMCU

gcode:
    # Speed
    {% set speed  = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|int %}
    # Iterations
    {% set iterations = params.ITERATIONS|default(5)|int %}
    # Acceleration
    {% set accel  = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|int %}
    # Minimum Cruise Ratio
    {% set min_cruise_ratio = params.MIN_CRUISE_RATIO|default(0.5)|float %}
    # Bounding inset for large pattern (helps prevent slamming the toolhead into the sides after small skips, and helps to account for machines with imperfectly set dimensions)
    {% set bound = params.BOUND|default(20)|int %}
    # Size for small pattern box
    {% set smallpatternsize = SMALLPATTERNSIZE|default(20)|int %}
    
    # Large pattern
        # Max positions, inset by BOUND
        {% set x_min = printer.toolhead.axis_minimum.x + bound %}
        {% set x_max = printer.toolhead.axis_maximum.x - bound %}
        {% set y_min = printer.toolhead.axis_minimum.y + bound %}
        {% set y_max = printer.toolhead.axis_maximum.y - bound %}
    
    # Small pattern at center
        # Find X/Y center point
        {% set x_center = (printer.toolhead.axis_minimum.x|float + printer.toolhead.axis_maximum.x|float ) / 2 %}
        {% set y_center = (printer.toolhead.axis_minimum.y|float + printer.toolhead.axis_maximum.y|float ) / 2 %}
        
        # Set small pattern box around center point
        {% set x_center_min = x_center - (smallpatternsize/2) %}
        {% set x_center_max = x_center + (smallpatternsize/2) %}
        {% set y_center_min = y_center - (smallpatternsize/2) %}
        {% set y_center_max = y_center + (smallpatternsize/2) %}

    # Save current gcode state (absolute/relative, etc)
    SAVE_GCODE_STATE NAME=TEST_SPEED
    
    # Output parameters to g-code terminal
    { action_respond_info("TEST_SPEED: starting %d iterations at speed %d, accel %d" % (iterations, speed, accel)) }
    
    # Home and get position for comparison later:
        M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
        G28 X Y
        # QGL if not already QGLd (only if QGL section exists in config)
        {% if printer.configfile.settings.quad_gantry_level %}
            {% if printer.quad_gantry_level.applied == False %}
                QUAD_GANTRY_LEVEL
                G28 Z
            {% endif %}
        {% endif %} 
        # Move 50mm away from max position and home again (to help with hall effect endstop accuracy - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/24)
        G90
        G1 X{printer.toolhead.axis_maximum.x-50} Y{printer.toolhead.axis_maximum.y-50} F{30*60}
        M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
        G28 X Y
        G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
        G4 P1000 
        GET_POSITION

    # Go to starting position
    G0 X{x_min} Y{y_min} Z{bound + 10} F{speed*60}

    # Set new limits
    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} MINIMUM_CRUISE_RATIO={min_cruise_ratio}
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} ACCEL_TO_DECEL={accel / 2}
    {% endif %}

    {% for i in range(iterations) %}
        # Large pattern diagonals
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_max} Y{y_max} F{speed*60}
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
        G0 X{x_min} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
        
        # Large pattern box
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_min} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
    
        # Small pattern diagonals
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_max} Y{y_center_max} F{speed*60}
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
        G0 X{x_center_min} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
        
        # Small pattern box
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_min} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
    {% endfor %}

    # Restore max speed/accel/accel_to_decel to their configured values
    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} MINIMUM_CRUISE_RATIO={printer.configfile.settings.printer.minimum_cruise_ratio} 
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} ACCEL_TO_DECEL={printer.configfile.settings.printer.max_accel_to_decel}
    {% endif %}

    # Re-home and get position again for comparison:
        M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
        G28 X Y # This is a full G28 to fix an issue with CoreXZ - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/12
        # Go to XY home positions (in case your homing override leaves it elsewhere)
        G90
        G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
        G4 P1000 
        GET_POSITION

    # Restore previous gcode state (absolute/relative, etc)
    RESTORE_GCODE_STATE NAME=TEST_SPEED


#    █▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀█
#    █  █    █▀▀▀ █▀▀▄       █    █  ▄▀▀▄  █  █ ▀▀█▀▀ ▄▀▀▄  █
#    █  █    █▄▄  █  █       █    █  █ ▄▄  █▄▄█   █    ▀▄   █
#    █  █    █    █  █       █    █  █  █  █  █   █      █  █
#    █  █▄▄▄ █▄▄▄ █▄▄▀       █▄▄▄ █  ▀▄▄▀  █  █   █   ▀▄▄▀  █
#    █▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄█


    # use NEOPIXEL_DISPLAY LED=Led_Name TYPE=template_type MODE=template_mode

# for TYPE use:
# extruder_temp     :extruder temperature progress
# bed_temp          :bed temperature progress
# print_percent     :print progress
# printer_speed     :printer speed

# for MODE use:
# progress          :the leds will light up one by one
# glow              :all leds will fade from one color (or non) to other color

# more info: https://github.com/digitalninja-ro/klipper-neopixel/blob/master/README.md

[gcode_macro NEOPIXEL_DISPLAY]
gcode:
    {% set led = params.LED %}
    {% set type = params.TYPE %}
    {% set mode = params.MODE %}
    {% set my_neopixel = printer.configfile.config['neopixel ' ~ led] %}

    {% if mode == 'progress' %}
        {% for i in range(my_neopixel.chain_count|int) %}
            SET_LED_TEMPLATE LED={led} INDEX={i+1} TEMPLATE={'led_' ~ type ~ '_' ~ mode} param_led_num={i+1} param_led_total={my_neopixel.chain_count|int}
        {% endfor %}
    {% endif %}
    {% if mode == 'glow' %}
        SET_LED_TEMPLATE LED={led} TEMPLATE={'led_' ~ type ~ '_' ~ mode}
    {% endif %}

[display_template led_extruder_temp_glow]
text:
    {% if printer.extruder.target > 0.0 %}
        {%  set temp = printer.extruder.target %}
    {% else %}
        {% set temp = printer.configfile.config.extruder.max_temp %}
    {% endif %}
    {% set ratio = printer.extruder.temperature / temp|float %}
    {ratio}, 0.0, {1-ratio}, 0.0

[display_template led_extruder_temp_progress]
param_led_num:  0
param_led_total: 1
text:
    {% if printer.extruder.target > 0.0 %}
        {%  set temp = printer.extruder.target %}
    {% else %}
        {% set temp = printer.configfile.config.extruder.max_temp %}
    {% endif %}
    {% set ratio = printer.extruder.temperature / temp|float %}
    {% set led_ratio = param_led_num|float / param_led_total %}
    {% if ratio > led_ratio %}
        {led_ratio}, 0.0, 0.0, 0.0
    {% else %}
        0.0, 0.0, 0.0, 0.0
    {% endif %}

[display_template led_bed_temp_glow]
text:
    {% if printer.heater_bed.target > 0.0 %}
        {%  set temp = printer.heater_bed.target %}
    {% else %}
        {% set temp = printer.configfile.config.heater_bed.max_temp %}
    {% endif %}
    {% set ratio = printer.heater_bed.temperature / temp|float %}
    {ratio}, 0.0, {1-ratio}, 0.0

[display_template led_bed_temp_progress]
param_led_num:  0
param_led_total: 1
text:
    {% if printer.heater_bed.target > 0.0 %}
        {%  set temp = printer.heater_bed.target %}
    {% else %}
        {% set temp = printer.configfile.config.heater_bed.max_temp %}
    {% endif %}
    {% set ratio = printer.heater_bed.temperature / temp|float %}
    {% set led_ratio = param_led_num|float / param_led_total %}
    {% if ratio > led_ratio %}
        {led_ratio}, 0.0, 0.0, 0.0
    {% else %}
        0.0, 0.0, 0.0, 0.0
    {% endif %}

