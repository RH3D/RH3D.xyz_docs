# IF PRINTER_IS_VIRTU_E3  
[gcode_macro PRINT_START]
gcode:
# This part fetches data from your slicer. Such as bed, extruder, and chamber temps and size of your printer.
  {% set vars = printer["gcode_macro _USER_VARIABLES"] %}
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_chamber = params.CHAMBER|default("45")|int %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}
    G90                                       # use absolute coordinates
    M83                                       # extruder relative mode
    G21                                       # metric values
  #SET_VELOCITY_LIMIT ACCEL=5000 # sets lower accelerations
    M140 S{target_bed}                        # bed heating start
    M104 S150                                 # extruder preheating to 150
    SET_GCODE_OFFSET Z=0                      # Reset Z offset
  SET_TMC_CURRENT STEPPER=stepper_z CURRENT={ vars.z_normal }
  SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT={ vars.z_normal }
  SET_TMC_CURRENT STEPPER=stepper_z2 CURRENT={ vars.z_normal }
    G28
    G1 Z215 F24000                            # pre-Z-tilt sequence - go to position
  SET_TMC_CURRENT STEPPER=stepper_z CURRENT={ vars.z_low }
  SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT={ vars.z_low }
  SET_TMC_CURRENT STEPPER=stepper_z2 CURRENT={ vars.z_low }
    G1 Z230 F150                              # pre-Z-tilt sequence - roughly align motors if misaligned too much
  SET_TMC_CURRENT STEPPER=stepper_z CURRENT={ vars.z_normal }
  SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT={ vars.z_normal }
  SET_TMC_CURRENT STEPPER=stepper_z2 CURRENT={ vars.z_normal }
    G1 Z30 F24000                              # move to Z30 for preheating
    M190 S{target_bed}                        # wait for bed temperature
    M109 S150                                 # wait for extruder at 150
    #G4 P120000                                # Wait 2 min for the bedtemp to stabilize
    G28 Z                                     # home Z after heating bed
  Z_TILT_ADJUST                               # adjust bed tilt
    G28 Z                                     # home Z with bed tilt adjusted
  BED_MESH_CALIBRATE                          # Start the bed mesh (add ADAPTIVE=1 for adaptive bed mesh)
  CARTOGRAPHER_TOUCH_HOME                          # nozzle touch
    M104 S{target_extruder}                   # extruder heating start
    G1 X20 Y2 Z20 F3000                       # heating position
    M109 S{target_extruder}                   # extruder heatup wait 
  # PRIMELINE
    G0 X2 Y2 F10000                           # Go to starting point
    G0 Z0.4                                   # Raise Z to 0.4
    G91                                       # Incremental positioning 
    G1 X50 E10 F1000                          # Primeline
    G90                                       # Absolute position
# ENDIF

# IF PRINTER_IS_VIRTU_E3
[gcode_macro PRINT_END]
gcode:
  {% set vars = printer["gcode_macro _USER_VARIABLES"] %}
    G4                                        # Wait to finish commands
    M221 S100                                 # Restore Flow to 100%
    M106 S0                                   # turn off cooling fan
    M104 S0                                   # turn off hotend heater
    M140 S0                                   # turn off bed heater
    G91                                       # Relative positioning
    G1 Z1
    G1 F1800 E-5                              # retract
    G90                                       # Absolute positioning
    G1 X20 Y210 F30000                        # Move head back
  SET_TMC_CURRENT STEPPER=stepper_z CURRENT={ vars.z_idle }
  SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT={ vars.z_idle }
  SET_TMC_CURRENT STEPPER=stepper_z2 CURRENT={ vars.z_idle }
  SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
  SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0
  SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
  {% if vars.is_awd %}
    SET_STEPPER_ENABLE STEPPER=stepper_x1 ENABLE=0
	SET_STEPPER_ENABLE STEPPER=stepper_y1 ENABLE=0
  {% endif %}
  SET_KINEMATIC_POSITION CLEAR_HOMED=XY
# ENDIF


#    █▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀█
#    █  █▀▀▄  ▄▀▀▄  ▄▀▀▄ ▀▀█▀▀ █
